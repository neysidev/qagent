[project]
name = "qagent-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "convex>=0.8",
  "httpx>=0.27",
  "playwright==1.63.0",
  "pydantic>=2.9",
  "langgraph>=1.2",
  "langchain-core>=1.6",
  "langchain-google-genai>=4.4",
  "langchain-openai>=1.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qagent_worker", "qagent_worker.browser", "qagent_worker.agent"]
