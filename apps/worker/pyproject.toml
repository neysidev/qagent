[project]
name = "qagent-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "convex>=0.8",
  "httpx>=0.27",
  "playwright==1.63.0",
  "pydantic>=2.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qagent_worker", "qagent_worker.browser"]
